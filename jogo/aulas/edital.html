<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edital TJPB 2026 — Desenvolvimento de Sistemas</title>
<link rel="stylesheet" href="aula.css?v=7">
<style>
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat span{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:700;font-size:15px}
.stat b{color:var(--acc)}
.bars{margin:10px 0;display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 38px;grid-template-rows:auto auto;column-gap:8px;row-gap:3px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;cursor:pointer;touch-action:manipulation}
.bar:active{transform:scale(.985)}
.bar .nm{font-weight:700;font-size:16px;line-height:1.2}
.bar .nm i{font-style:normal;margin-right:6px}
.bar .qn{grid-column:2;grid-row:1/3;font-weight:800;font-size:22px;text-align:right;color:var(--acc)}
.bar.of .qn{color:#b07d00}
.bar .tr{height:10px;border-radius:6px;background:var(--cell);overflow:hidden}
.bar .tr u{display:block;height:100%;border-radius:6px;background:repeating-linear-gradient(45deg,var(--acc) 0 6px,var(--acc-bg) 6px 10px);text-decoration:none}
.bar.of .tr u{background:var(--key)}
.legend{font-size:14px;color:var(--muted);margin:8px 0}
.legend b.o{color:#b07d00}
.items{margin:12px 0;display:grid;gap:8px}
.it{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:17px;line-height:1.45;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.it.sub{margin-left:18px}
.it .ck{flex:none;width:26px;height:26px;border-radius:50%;border:3px solid var(--line);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff}
.it.on{background:var(--ok-bg);border-color:var(--ok)}
.it.on .ck{background:var(--ok);border-color:var(--ok)}
.it.on .tx{opacity:.8}
.it .tx b{color:var(--acc)}
.prog{display:inline-block;margin-left:6px;font-size:13px;font-weight:800;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:1px 9px;vertical-align:middle}
.tapnote{font-size:14px;color:var(--muted);margin:2px 0 6px}
@media (max-width:680px),(max-width:900px) and (orientation:portrait){
  .it{font-size:17px;padding:11px 12px}
  .bar .nm{font-size:15.5px}
}
</style></head>
<body data-subject="edital" data-title="Edital TJPB" data-finish="close">
<script src="../edital.js?v=2"></script>
<script>
(function(){
  'use strict';
  var E=window.EDITAL||{secoes:[]},S=E.secoes;
  var SHORT={prova:'A prova',pt:'Português',rl:'Raciocínio Lógico',comum:'Fundamentos de TI',c5_1:'Engenharia de Software',c5_2:'System Design',c5_3:'Arquitetura de Software',c5_4:'Algoritmos e Programação',c5_5:'Mobile',c5_6:'Banco de Dados',c5_7:'DevOps e Nuvem',c5_8:'Inteligência Artificial',c5_9:'Segurança e Qualidade',c5_10:'Governança do Judiciário',c5_11:'UI/UX e Acessibilidade'};
  var KEY='tjpb-edital-ok',ok={};
  try{ok=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(ok))}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  // Divide o texto literal em itens SEM mudar nenhuma palavra (juntar com espaço devolve o original)
  function split(sc){
    var t=sc.x,M='\u0001';
    if(sc.id==='pt'||sc.id==='rl')return t.replace(/\s+(?=\d+(?:\.\d+)*\.?\s+[A-ZÀ-Ú])/g,M).split(M);
    return t.replace(/\.\s+(?=[A-ZÀ-Ú])/g,'.'+M).split(M);
  }
  window.__editalSplit=split;
  function itemHtml(txt){
    var m=/^(\d+(?:\.\d+)*\.?)\s+(.*)$/.exec(txt);
    if(m)return '<b>'+esc(m[1])+'</b> '+esc(m[2]);
    var i=txt.indexOf(': ');
    if(i>2&&i<=70)return '<b>'+esc(txt.slice(0,i+1))+'</b> '+esc(txt.slice(i+2));
    return esc(txt);
  }
  var total=0;S.forEach(function(sc){sc.items=split(sc);total+=sc.items.length});
  function done(sc){var n=0;for(var i=0;i<sc.items.length;i++)if(ok[sc.id+':'+i])n++;return n}
  function totalDone(){var n=0;S.forEach(function(sc){n+=done(sc)});return n}
  var h='<section class="chapter" data-title="Edital TJPB · Dev. de Sistemas">';
  // ---- slide 1: visão geral + quantas questões por tema ----
  h+='<div class="slide" data-over="1"><span class="tag">EDITAL 01/2026 · ANEXO I</span><h1>📜 O que cai na prova</h1>'
   +'<p class="lead">TJPB · Analista TI · Desenvolvimento de Sistemas · 24/01/2027</p>'
   +'<div class="stat"><span><b>60</b> objetivas</span><span><b>1</b> discursiva (40 pts)</span><span>Sem inglês</span></div>'
   +'<h3>🎯 Quantas questões de cada tema</h3><div class="bars">';
  S.forEach(function(sc,i){
    if(!sc.q)return;
    h+='<button type="button" class="bar'+(sc.qo?' of':'')+'" data-go="'+(i+1)+'"><span class="nm"><i>'+sc.ic+'</i>'+esc(SHORT[sc.id]||sc.t)+'</span><span class="qn">'+(sc.qo?'':'≈')+sc.q+'</span><span class="tr"><u style="width:'+Math.round(sc.q/10*100)+'%"></u></span></button>';
  });
  h+='</div><p class="legend"><b class="o">Dourado = número oficial</b> do edital (Português 10, Raciocínio 10 e Específicos 40 no total). <b>Listrado ≈ = estimativa</b>: o edital não divide as 40 entre os temas; os números somam 40, mas são cálculo, não regra da banca.</p>'
   +'<div class="magic">Toque num tema para ir direto nele.<small>Dentro de cada tema, toque num item para marcar como estudado ✓. <span id="ov-prog"></span></small></div></div>';
  // ---- um slide por matéria ----
  S.forEach(function(sc,si){
    h+='<div class="slide"><span class="tag">'+esc(sc.sub)+'</span><h2>'+sc.ic+' '+esc(sc.t)+' <span class="prog" data-p="'+sc.id+'"></span></h2>';
    if(sc.q)h+='<div class="magic">'+(sc.qo?'🎯 '+sc.q+' questões':'≈ '+sc.q+' questões')+'<small>'+(sc.qo?'Número oficial do edital.':'Estimativa: o edital só fixa 40 questões para todos os Específicos juntos.')+'</small></div>';
    h+='<p class="tapnote">Texto literal do edital. Toque num item para marcar ✓</p><div class="items">';
    sc.items.forEach(function(t,i){
      h+='<div class="it'+(/^\d+\.\d+/.test(t)?' sub':'')+(ok[sc.id+':'+i]?' on':'')+'" data-k="'+sc.id+':'+i+'"><span class="ck">'+(ok[sc.id+':'+i]?'✓':'')+'</span><span class="tx">'+itemHtml(t)+'</span></div>';
    });
    h+='</div></div>';
  });
  h+='</section>';
  var wrap=document.createElement('div');wrap.innerHTML=h;document.body.appendChild(wrap.firstChild);
  function refresh(){
    var n=totalDone(),o=document.getElementById('ov-prog');
    if(o)o.textContent='Estudado: '+n+' de '+total+' itens.';
    S.forEach(function(sc){var e=document.querySelector('[data-p="'+sc.id+'"]');if(e){var d=done(sc);e.textContent=d?('✓ '+d+'/'+sc.items.length):'';e.style.display=d?'':'none'}});
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('.it');
    if(t){var k=t.getAttribute('data-k');if(ok[k]){delete ok[k];t.classList.remove('on');t.firstChild.textContent=''}else{ok[k]=1;t.classList.add('on');t.firstChild.textContent='✓'}save();refresh();return}
    var b=e.target.closest&&e.target.closest('.bar');
    if(b){var d=document.querySelector('.au-dots');var i=+b.getAttribute('data-go');if(d&&d.children[i])d.children[i].click()}
  });
  refresh();
})();
</script>
<script src="aula.js?v=8"></script>
</body></html>
