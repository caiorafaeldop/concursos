<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TJPB Quest</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  html,body{margin:0;height:100dvh;background:#1b1b2b;display:flex;align-items:center;justify-content:center;font-family:"Courier New",monospace;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  #screen{position:relative;width:960px;height:640px;max-width:100vw;max-height:100dvh;aspect-ratio:3/2;border:6px solid #3a3a55;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 40px #0008;box-sizing:border-box}
  canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
  .ov{position:absolute;inset:0;pointer-events:none}
  #hud{position:absolute;left:10px;top:10px;color:#fff;background:#000a;padding:6px 10px;border-radius:6px;font-size:15px;font-weight:bold;text-shadow:1px 1px #000}
  #box{position:absolute;left:3%;right:3%;bottom:3%;background:#f8f8f0;border:5px solid #384060;border-radius:10px;padding:12px 16px 14px;font-size:20px;line-height:1.35;color:#202030;display:none;box-shadow:0 0 0 3px #f8f8f0 inset}
  #box .nm{position:absolute;top:-17px;left:14px;background:#384060;color:#fff;font-size:15px;padding:2px 10px;border-radius:6px}
  #box .tx{white-space:pre-wrap;min-height:2.7em}
  #box .nx{position:absolute;right:14px;bottom:4px;font-size:14px;animation:b .6s infinite alternate}
  @keyframes b{to{transform:translateY(4px)}}
  #battle{position:absolute;inset:0;display:none;background:linear-gradient(#cfe9ff,#fbf4d6 55%,#b6e3a2 55%);flex-direction:column;padding:14px 18px;box-sizing:border-box;color:#202030}
  .bossbar{align-self:flex-end;background:#f8f8f0;border:4px solid #384060;border-radius:10px;padding:6px 12px;min-width:300px}
  .bar{height:12px;background:#ccc;border-radius:6px;overflow:hidden;margin-top:4px;border:2px solid #384060}
  .bar i{display:block;height:100%;background:#e8453c;transition:width .4s}
  .arena{flex:0 0 120px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px}
  .blk{width:64px;height:64px;border-radius:8px;position:relative;box-shadow:inset -6px -6px 0 #0003}
  .blk:before,.blk:after{content:"";position:absolute;top:20px;width:8px;height:8px;background:#222;border-radius:50%}
  .blk:before{left:16px}.blk:after{right:16px}
  .blk.shake{animation:sh .4s}
  @keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .qbox{background:#f8f8f0;border:5px solid #384060;border-radius:10px;padding:10px 16px;flex:1;display:flex;flex-direction:column;overflow:auto;box-sizing:border-box}
  .hearts{align-self:flex-start;font-size:20px;background:#f8f8f0;border:4px solid #384060;border-radius:10px;padding:2px 10px}
  .q{font-size:17px;line-height:1.3;margin-bottom:8px;font-weight:bold}
  .opt{font-size:16px;padding:4px 8px;border-radius:6px;cursor:pointer;pointer-events:auto;line-height:1.25}
  .opt.sel{background:#ffe27a}
  .opt.sel:before{content:"▶ "}
  .fb{font-size:17px;line-height:1.35;white-space:pre-wrap}
  .fb b.ok{color:#1d8f3a}.fb b.no{color:#c4302b}
  #title{position:absolute;inset:0;background:radial-gradient(#3f6fd8,#18204a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
  #title h1{font-size:54px;margin:0;color:#ffd84a;text-shadow:4px 4px #b33,0 0 20px #000}
  #title p{font-size:20px;margin:0}
  #title .go{animation:b .6s infinite alternate;font-size:24px}

  /* ---------- controles e responsividade mobile (vertical e horizontal) ---------- */
  #mctrl{display:none;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:10px 14px;box-sizing:border-box;gap:10px;touch-action:none}
  body.is-touch #mctrl,body.force-ctrl #mctrl{display:flex}
  @media (hover:none),(pointer:coarse),(max-width:900px),(max-height:560px){#mctrl{display:flex}}
  body[data-mode="aula"] #mctrl,body[data-mode="mini"] #mctrl,body.hide-ctrl #mctrl,body[data-mode="aula"] #mtoggle,body[data-mode="mini"] #mtoggle{display:none!important}
  .dpad{--b:clamp(42px,13vw,58px);display:grid;grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(3,var(--b));gap:4px;flex:none}
  .dpad button,.macts button{border:3px solid #4e567a;background:#2a2e45;color:#fff;border-radius:12px;font:bold 18px "Courier New",monospace;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;box-shadow:0 4px 0 #151726;padding:0;white-space:nowrap}
  .dpad button:active,.dpad button.on,.macts button:active{transform:translateY(2px);box-shadow:0 2px 0 #151726;background:#454c73}
  .dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .c{grid-column:2;grid-row:2;opacity:.35;pointer-events:none}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
  .macts{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:0}
  .macts .mpills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .macts .mpill{height:38px;padding:0 10px;font-size:13px;border-radius:10px}
  .macts .mmain{display:flex;gap:10px;align-items:center}
  .macts .mok{width:clamp(58px,18vw,76px);height:clamp(58px,18vw,76px);border-radius:50%;background:#2ea043;border-color:#7be391;font-size:18px}
  .macts .mok:active{background:#248336}
  .macts .mesc{width:clamp(44px,13vw,54px);height:clamp(44px,13vw,54px);border-radius:50%;background:#7a3842;border-color:#d98a96;font-size:11px}
  /* modo sobreposto (paisagem ou PC com controles ligados) */
  body.force-ctrl #mctrl{position:fixed;inset:0;max-width:none;pointer-events:none;align-items:flex-end;padding:14px;z-index:40}
  body.force-ctrl #mctrl .dpad,body.force-ctrl #mctrl .macts{pointer-events:auto;opacity:.85}
  #mtoggle{position:fixed;right:10px;top:10px;z-index:60;border:2px solid #4e567a;background:#2a2e45cc;color:#fff;border-radius:10px;font:bold 13px "Courier New",monospace;padding:6px 10px;cursor:pointer}

  @media (orientation:portrait) and (max-width:900px){
    body{flex-direction:column;justify-content:flex-start;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    #screen{width:100vw;height:64dvh;max-height:64dvh;aspect-ratio:auto;border-width:2px;border-radius:0;flex:none}
    #mctrl{flex:1;align-items:center;position:static!important;padding:8px 12px!important;pointer-events:auto!important}
    #mctrl .dpad,#mctrl .macts{opacity:1!important}
    #mtoggle{top:auto;bottom:calc(36dvh - 34px);right:8px;font-size:11px;padding:4px 7px}
  }
  @media (orientation:landscape) and (max-height:560px){
    #screen{width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;aspect-ratio:auto;border-width:0;border-radius:0}
    #mctrl{position:fixed;inset:0;max-width:none;pointer-events:none;align-items:flex-end;padding:10px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));z-index:40}
    #mctrl .dpad,#mctrl .macts{pointer-events:auto;opacity:.82}
    .dpad{--b:44px}
    .macts .mok{width:62px;height:62px;font-size:17px}
    .macts .mesc{width:46px;height:46px}
    #mtoggle{top:auto;bottom:auto;top:8px;right:auto;left:50%;transform:translateX(-50%);font-size:11px;padding:4px 8px}
  }
  @media (max-width:720px),(max-height:500px){
    #hud{font-size:11px;padding:3px 7px;left:6px;top:6px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #box{font-size:13px;padding:8px 10px 10px;border-width:3px}
    #box .nm{font-size:12px;top:-13px;padding:1px 7px}
    #title h1{font-size:30px}
    #title p{font-size:12px;padding:0 12px}
    #title .go{font-size:16px}
    #battle{padding:8px 10px}
    .bossbar{min-width:150px;font-size:12px;padding:4px 8px;border-width:3px}
    .hearts{font-size:14px;border-width:3px;padding:2px 7px}
    .arena{flex:0 0 64px;padding:0 16px}
    .blk{width:40px;height:40px}
    .blk:before,.blk:after{top:12px;width:5px;height:5px}
    .blk:before{left:10px}.blk:after{right:10px}
    .qbox{padding:8px 10px;border-width:3px}
    .q{font-size:13px;margin-bottom:5px}
    .opt{font-size:12px;padding:5px 7px}
    .fb{font-size:13px}
    #modal .mbox{min-width:0!important;max-width:95%!important;max-height:92%!important;padding:10px 12px!important;font-size:13px!important}
    #modal .mbox h2{font-size:16px!important}
    #modal .cards{grid-template-columns:repeat(2,1fr)!important}
    #modal .mbox>div[style*="display:flex"]{flex-direction:column!important}
    #mapc{width:100%!important;height:auto!important;max-height:52%!important}
    #mapl{min-width:0!important;max-height:110px!important;font-size:12px!important}
  }
</style>
</head>
<body>
<div id="screen">
  <canvas id="c" width="240" height="160"></canvas>
  <div class="ov">
    <div id="hud"></div>
    <div id="box"><div class="nm"></div><div class="tx"></div><div class="nx">▼</div></div>
  </div>
  <div id="battle"></div>
  <div id="title"><h1>TJPB QUEST</h1><p>Estude a prova do Tribunal de Justiça da Paraíba<br>explorando a cidade e derrotando os professores!</p><p>Setas/WASD ou D-Pad = andar · Enter/Z/OK = falar/confirmar</p><p class="go">▶ Pressione Enter ou Toque ◀</p></div>
</div>
<div id="mctrl" aria-label="Controles móveis">
  <div class="dpad">
    <button type="button" class="u" data-dir="up" aria-label="Cima">▲</button>
    <button type="button" class="l" data-dir="left" aria-label="Esquerda">◀</button>
    <button type="button" class="c" tabindex="-1" aria-hidden="true">•</button>
    <button type="button" class="r" data-dir="right" aria-label="Direita">▶</button>
    <button type="button" class="d" data-dir="down" aria-label="Baixo">▼</button>
  </div>
  <div class="macts">
    <div class="mpills">
      <button type="button" class="mpill" data-key="m" aria-label="Mapa">🗺 Mapa</button>
      <button type="button" class="mpill" data-key="c" aria-label="Cartas">🃏</button>
      <button type="button" class="mpill" data-key="n" aria-label="Som">🔊</button>
    </div>
    <div class="mmain">
      <button type="button" class="mesc" data-key="Escape" aria-label="Voltar">Voltar</button>
      <button type="button" class="mok" data-key="Enter" aria-label="Confirmar">OK</button>
    </div>
  </div>
</div>
<button type="button" id="mtoggle" aria-label="Mostrar ou esconder controles">🎮 Controles</button>

</body>
